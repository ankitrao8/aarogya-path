<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Heart Badge with Cross -->
  <g filter="url(#shadow)">
    <!-- Smooth Heart Shape -->
    <path
      d="M50 82 C22 62 12 44 12 28 C12 14 24 6 36 6 C43 6 48 10 50 14 C52 10 57 6 64 6 C76 6 88 14 88 28 C88 44 78 62 50 82 Z"
      fill="url(#heartGrad)"
    />
    <!-- White Medical Cross -->
    <rect x="44" y="24" width="12" height="26" rx="4" fill="#ffffff" />
    <rect x="37" y="31" width="26" height="12" rx="4" fill="#ffffff" />
  </g>

  <!-- Brand Typography -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="110" y="52" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
      Aarogya <tspan fill="#10b981">Path</tspan>
    </text>
    <text x="112" y="74" font-size="14" font-weight="600" fill="#059669" letter-spacing="0.5">
      Health for Every Home • सत्य समय पर सही इलाज
    </text>
  </g>
</svg>
